<!doctype html>
<html lang="de" data-design="dunkel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Stempelpass</title>
<meta name="description" content="Reiseziele auf der Karte abstempeln – gemeinsam, auch offline.">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stempelpass">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
<script>
  // Design vor dem ersten Zeichnen setzen, damit nichts aufblitzt
  try {
    const d = (JSON.parse(localStorage.getItem('sp.ich') || '{}').design) || 'auto';
    const hell = d === 'hell' || (d === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.design = hell ? 'hell' : 'dunkel';
  } catch {}
</script>
</head>
<body>
<div id="map" aria-label="Karte"></div>

<main id="ansichten">
  <section class="tab an" id="tab-reisen" aria-label="Reisen"></section>
  <section class="tab" id="tab-entdecken" aria-label="Entdecken"></section>
  <section class="tab" id="tab-karte" aria-label="Karte"></section>
  <section class="tab" id="tab-profil" aria-label="Profil"></section>
</main>

<nav class="tabbar glas-dicht" id="tabbar" aria-label="Navigation">
  <span class="tab-blase"></span>
  <button class="tab-knopf an" data-tab="reisen"></button>
  <button class="tab-knopf" data-tab="entdecken"></button>
  <button class="tab-knopf" data-tab="karte"></button>
  <button class="tab-knopf" data-tab="profil"></button>
</nav>

<div class="auswahl" id="auswahl" hidden>
  <div class="fadenkreuz"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="#fff" stroke-width="1.4" aria-hidden="true"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="none"/></svg></div>
  <div class="auswahl-leiste">
    <button class="knopf glas" id="auswahlAbbruch"></button>
    <button class="knopf akzent" id="auswahlOk"></button>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-hg" data-zu></div>
  <div class="modal-karte glas-dicht" role="dialog" aria-modal="true" id="modalKarte"></div>
</div>

<div class="toast glas-dicht" id="toast" role="status" aria-live="polite"></div>


<script defer src="vendor/maplibre-gl.js"></script>
<script defer src="vendor/pmtiles.js"></script>
<script defer src="vendor/basemaps.js"></script>
<script defer src="vendor/nostr.bundle.js"></script>
<script defer src="vendor/qrcode.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
